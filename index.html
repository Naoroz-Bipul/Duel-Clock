<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel Clock - Dhaka Time Zone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SolaimanLipi Font CDN -->
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container main-card p-4 p-md-5">
        <h2 class="text-center project-title mb-2">DUEL CLOCK</h2>
        <div class="text-center mb-5">
            <span class="timezone-badge">Asia / Dhaka (GMT +6)</span>
        </div>
        
        <div class="row align-items-center g-4">
            <!-- Left Side: Analog Clock -->
            <div class="col-md-6 d-flex flex-column align-items-center border-end-md">
                <div class="clock-label mb-4">অ্যানালগ ঘড়ি</div>
                <div class="analog-clock">
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand minute-hand" id="minuteHand"></div>
                    <div class="hand second-hand" id="secondHand"></div>
                    <div class="center-dot"></div>
                    <div class="number num-12">12</div>
                    <div class="number num-3">3</div>
                    <div class="number num-6">6</div>
                    <div class="number num-9">9</div>
                </div>
            </div>

            <!-- Right Side: Digital Clock -->
            <div class="col-md-6 d-flex flex-column align-items-center justify-content-center">
                <div class="clock-label mb-4">ডিজিটাল ঘড়ি</div>
                <div class="digital-clock-card text-center w-100 p-4">
                    <div class="digital-time" id="digitalTime">00:00:00</div>
                    <div class="ampm my-1" id="ampm">AM</div>
                    <div class="digital-date mt-3" id="digitalDate">তারিখ লোড হচ্ছে...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
